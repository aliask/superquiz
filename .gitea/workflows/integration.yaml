name: Integration tests
on:
  # Checks the live quiz sites haven't changed underneath us. This is kept out
  # of the image build so an upstream outage can't block a release.
  schedule:
    - cron: '0 22 * * *' # 8am AEST, after the morning's quiz is up
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Test against the live sites
        run: go test -tags integration -v ./...
